name: ship
# Every push to main: test, move relay-live to the tested commit (Cloudflare Workers Builds deploys that
# branch), check production, and publish a release when cli/Cargo.toml has a version with no matching v* tag yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "cli\nrelay" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo test --manifest-path cli/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path relay/Cargo.toml
      - name: generated pages are committed (web/src/build.py output is not stale)
        run: python3 web/src/build.py && git diff --exit-code -- web/ && test -z "$(git status --porcelain -- web/)"
      - run: cargo install -q worker-build@^0.8
      - name: end-to-end (local relay, two daemons)
        timeout-minutes: 15
        run: tests/e2e.sh
      - name: zero-install client (web/la.mjs) against the daemon
        timeout-minutes: 8
        run: tests/zero.sh
      - name: attacks (outsider, relay operator, invites, local machine, pi-intercom)
        timeout-minutes: 12
        run: tests/attack.sh
      - name: cost (Durable Object requests, 0.6.0 behaviour vs this tree, one hour in 3 minutes)
        timeout-minutes: 15
        run: tests/cost.sh

  # Cloudflare Workers Builds deploys the relay from the relay-live branch with its own credential (no
  # Cloudflare token in GitHub). Only a commit that passed `test` reaches that branch.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: { group: promote-relay-live, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: fast-forward relay-live to the tested commit
        run: |
          git fetch origin relay-live
          if ! git merge-base --is-ancestor origin/relay-live "$GITHUB_SHA"; then
            echo "::error::relay-live ($(git rev-parse origin/relay-live)) is not an ancestor of $GITHUB_SHA: not a fast-forward. Fix relay-live by hand (see README, Deploy)."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/relay-live"

  prod-check:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: wait for Cloudflare to serve the tested commit (20 min)
        run: |
          for _ in $(seq 60); do
            live=$(curl -sS -o /dev/null -D - https://letagents.talk/ | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sed -n 's/^x-letagents-commit: //p')
            [ "$live" = "$GITHUB_SHA" ] && { echo "live: $live"; exit 0; }
            echo "live: ${live:-none}, want $GITHUB_SHA"
            sleep 20
          done
          echo "::error::letagents.talk did not serve $GITHUB_SHA within 20 minutes (check Workers Builds in the Cloudflare dashboard)"
          exit 1
      - name: production security probes (read-only, a few GETs)
        run: tests/attack.sh --prod

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version in cli/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version exists: skip release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new: release"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release-build:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.zig
        run: pip install ziglang && cargo install cargo-zigbuild
      - if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - run: cp cli/target/${{ matrix.target }}/release/letagents letagents-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: { name: "letagents-${{ matrix.target }}", path: "letagents-${{ matrix.target }}" }

  release:
    needs: [release-check, release-build]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: sha256sum letagents-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            letagents-*
            SHA256SUMS
