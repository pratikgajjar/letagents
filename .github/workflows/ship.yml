name: ship
# Every push to main: test, deploy the relay, and publish a release when
# cli/Cargo.toml has a version with no matching v* tag yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "cli\nrelay" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo test --manifest-path cli/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path relay/Cargo.toml
      - name: generated page is committed
        run: python3 web/src/build.py && git diff --exit-code web/index.html
      - run: cargo install -q worker-build
      - name: end-to-end (local relay, two daemons)
        timeout-minutes: 8
        run: tests/e2e.sh

  deploy-relay:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install -q worker-build
      - name: wrangler deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: smoke test
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://letagents.talk/health \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' https://letagents.talk/llms.txt)" = 200 ]; then
              echo; echo "smoke ok"; exit 0
            fi
            sleep 10
          done
          echo "smoke test failed"; exit 1

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version in cli/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version exists: skip release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new: release"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release-build:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.zig
        run: pip install ziglang && cargo install cargo-zigbuild
      - if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - run: cp cli/target/${{ matrix.target }}/release/letagents letagents-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: { name: "letagents-${{ matrix.target }}", path: "letagents-${{ matrix.target }}" }

  release:
    needs: [release-check, release-build]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: sha256sum letagents-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            letagents-*
            SHA256SUMS
