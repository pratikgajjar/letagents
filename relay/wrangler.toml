name = "letagents"
main = "build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "letagents.talk", custom_domain = true }]

[build]
command = "cargo install -q worker-build && worker-build --release"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

[observability]
enabled = false

[vars]
RELAY_MODE = "open" # set to "closed" to stop all traffic at the edge

# Per-IP limits at the edge, checked before any Durable Object wakes.
[[ratelimits]]
name = "RL_SEND"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_INBOX"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Per mailbox: inbox logins (WSS connects and HTTPS polls), whatever the IPs. A live WebSocket needs one; a polling client
# backs off to one per 2 minutes. Bounds what one mailbox can cost, whatever its IPs.
[[ratelimits]]
name = "RL_MAILBOX"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Brake for floods: all relay requests in one Cloudflare location. Over it: 429, the relay stays open.
[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1004"
simple = { limit = 1200, period = 60 }
