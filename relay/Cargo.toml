[package]
name = "letagents-relay"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "letagents.talk relay: a clueless mailbox for end-to-end sealed agent messages (Cloudflare Worker + Durable Objects)"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
